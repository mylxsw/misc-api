[project]
name = "misc-api"
version = "0.1.0"
description = "A collection of various apis"
requires-python = ">=3.11"
dependencies = [
    "flask",
    "gunicorn",
    "dashscope",
    "pillow",
    "requests",
    "websockets>=15.0.1",
    "redis",
    "fish-audio-sdk",
    "markdown",
    "beautifulsoup4",
    "cssutils",
    "pyyaml",
    "pygments",
    "boto3>=1.43.83",
    "chardet<6",
    "urllib3>=2,<3",
    "mcp>=2,<3",
    "uvicorn>=0.53.0",
    "a2wsgi>=1.10.10",
    "starlette>=1.6.0",
    "typing-extensions>=4.15.0",
]

[project.scripts]
wechat-markdown = "lib.wechat.cli:main"
misc-api-mcp = "lib.mcp.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lib*"]

[tool.setuptools.package-data]
"lib.wechat" = ["themes/*.yaml"]
